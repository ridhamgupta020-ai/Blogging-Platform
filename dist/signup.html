<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Draftly account to write, manage drafts, and publish posts.">
  <meta name="theme-color" content="#171717">
  <title>Sign Up | Draftly</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/court-enhancements.css">
  <link rel="stylesheet" href="/css/styles.css">
  <meta property="og:title" content="Sign Up | Draftly">
  <meta property="og:description" content="Create a Draftly account to write, manage drafts, and publish posts.">
  <link rel="icon" href="/images/draftly-icon.svg" type="image/svg+xml">
</head>
<body>

<main class="auth-box">
  <a class="draftly-logo" href="/" aria-label="Draftly home"><img src="/images/draftly-logo-dark.svg" alt="Draftly" height="36"></a>
  <h1>Create your account</h1>
  <p class="auth-subtitle">A calmer home for your best ideas.</p>

  <a class="google-auth-button" href="/auth/google" data-google-auth>
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94a11.05 11.05 0 0 1-4.8 7.24l7.73 6C44.38 38.05 46.98 31.95 46.98 24.55Z"/>
      <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19Z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
    </svg>
    <span>Continue with Google</span>
  </a>
  <div class="google-auth-divider" aria-hidden="true"><span>or</span></div>

  <form id="signupForm" novalidate>
    <label for="signupName">Full name</label>
    <input type="text" id="signupName" name="name" placeholder="Your full name" autocomplete="name" maxlength="60" required>

    <label for="signupEmail">Email address</label>
    <input type="email" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email" required>

    <label for="signupPassword">Password</label>
    <input type="password" id="signupPassword" name="password" placeholder="Create a secure password" autocomplete="new-password" minlength="12" required>
    <small>At least 12 characters with a lowercase letter, uppercase letter, and number. We’ll email you a verification link.</small>

    <button type="submit">Create Account</button>
    <p class="status" id="status" aria-live="polite"></p>
  </form>

  <p>Already have an account? <a href="login.html">Log in</a></p>
</main>

<script src="/js/court-enhancements.js"></script>
<script src="/js/api.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/auth-page.js"></script>
</body>
</html>
