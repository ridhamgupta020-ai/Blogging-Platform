<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Blogging Platform</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/court-enhancements.css">
</head>
<body>
  <main class="auth-box">
    <a class="auth-brand" href="index.html">Blogging Platform</a>
    <h1>Forgot your password?</h1>
    <p class="auth-subtitle">We’ll send a reset link if an account exists for that email.</p>
    <form id="forgotPasswordForm" novalidate>
      <label for="resetEmail">Email address</label>
      <input id="resetEmail" name="email" type="email" autocomplete="email" required>
      <button type="submit">Send reset link</button>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
    <p><a href="login.html">Back to login</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-page.js"></script>
</body>
</html>
