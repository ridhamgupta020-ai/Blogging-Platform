<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Draftly</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/court-enhancements.css">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="description" content="Choose a new password for your Draftly account.">
  <meta property="og:title" content="Reset Password | Draftly">
  <meta property="og:description" content="Choose a new password for your Draftly account.">
  <meta name="theme-color" content="#171717">
  <link rel="icon" href="/images/draftly-icon.svg" type="image/svg+xml">
</head>
<body>
  <main class="auth-box">
    <a class="draftly-logo" href="/"><img src="/images/draftly-icon.svg" alt="Draftly" width="36" height="36"></a>
    <h1>Choose a new password</h1>
    <p class="auth-subtitle">Use at least 12 characters with lowercase, uppercase, and a number.</p>
    <form id="resetPasswordForm" novalidate>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Update password</button>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-page.js"></script>
</body>
</html>
