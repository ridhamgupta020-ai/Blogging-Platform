<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | Blogging Platform</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/court-enhancements.css">
</head>
<body>
  <main class="auth-box">
    <a class="auth-brand" href="index.html">Blogging Platform</a>
    <h1>Choose a new password</h1>
    <p class="auth-subtitle">Use at least 12 characters with lowercase, uppercase, and a number.</p>
    <form id="resetPasswordForm" novalidate>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Update password</button>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth-page.js"></script>
</body>
</html>
