<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage your Blogging Platform profile and published articles.">
  <meta name="theme-color" content="#171717">
  <title>Profile | Blogging Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/court-enhancements.css">
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html">Blogging Platform</a></div>
    <nav class="profile-nav" aria-label="Profile navigation">
      <a href="index.html">Home</a>
      <a href="blogs.html">Blogs</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>
  <main class="profile-page">
    <section class="profile-heading">
      <img id="profileAvatar" alt="Profile avatar" hidden>
      <div>
        <p class="eyebrow">Creator profile</p>
        <h1 id="profileName">Loading profile…</h1>
        <p id="profileBio"></p>
      </div>
    </section>
    <section id="profileEditor" class="profile-card" hidden>
      <h2>Account details</h2>
      <form id="profileForm">
        <label for="profileNameInput">Display name</label>
        <input id="profileNameInput" name="name" maxlength="60" required>
        <label for="profileEmailInput">Email address</label>
        <input id="profileEmailInput" name="email" type="email" required>
        <label for="currentPasswordForEmail">Current password <span>(required only when changing email)</span></label>
        <input id="currentPasswordForEmail" name="currentPassword" type="password" autocomplete="current-password">
        <button type="submit">Save profile</button>
        <p class="status" id="profileStatus" aria-live="polite"></p>
      </form>

      <h2>Profile photo</h2>
      <form id="avatarForm">
        <label for="avatarInput">Upload JPG, PNG, or WebP (5 MB maximum)</label>
        <input id="avatarInput" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
        <button type="submit">Update photo</button>
      </form>

      <h2>Change password</h2>
      <form id="passwordForm">
        <label for="oldPassword">Current password</label>
        <input id="oldPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required>
        <small>At least 12 characters with lowercase, uppercase, and a number.</small>
        <button type="submit">Change password</button>
      </form>
    </section>
    <section class="profile-articles">
      <h2 id="profileArticlesHeading">Published articles</h2>
      <div id="profileArticles" class="blog-grid" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-bottom">
      <p>© 2026 Blogging Platform</p>
      <a href="Contact.html">Contact</a>
    </div>
  </footer>
  <script src="/assets/js/court-enhancements.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/platform.js"></script>
  <script src="/assets/js/profile-page.js"></script>
</body>
</html>
